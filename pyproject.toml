[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscrap"
version = "0.1.0"
description = "Verified recent jobs and cached resume matching"
requires-python = ">=3.11"
dependencies = [
  "pymongo>=4.10,<5", "dnspython>=2.6,<3", "certifi>=2024.7.4",
  "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7",
  "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
ai = ["langchain>=1,<2", "langchain-openai>=1,<2"]
browser = ["playwright>=1.49,<2"]
test = ["mongomock>=4.3,<5"]

[project.scripts]
jobscrap = "jobscrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobscrap = ["web/templates/*.html", "web/static/*.css"]
